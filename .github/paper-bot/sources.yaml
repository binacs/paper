# paper-bot config.  Source of truth is Semantic Scholar's venue API: each
# `venues:` entry is queried for papers in `since_year` or later, and the
# combined pool is sorted by citation count locally so the highest-impact
# unanalyzed paper bubbles up first ("classics over arXiv firehose").
#
# Tune this file rather than the Python code for routine adjustments;
# changes take effect on the next scheduled or `workflow_dispatch` run.

# Top systems venues, plus the two AI-infra-flavored architecture / ML
# systems conferences.  Each venue has a default `topic` used as a fallback
# when the LLM classifier returns something off-list.
#
# Topic must exist as a top-level directory in this repo; see `topics:` below.
venues:
  - name: OSDI
    topic: orchestration-scheduling
  - name: SOSP
    topic: orchestration-scheduling
  - name: NSDI
    topic: distributed-system
  - name: USENIX ATC
    topic: distributed-system
  - name: EuroSys
    topic: orchestration-scheduling
  - name: SoCC
    topic: orchestration-scheduling
  - name: FAST
    topic: distributed-system
  - name: SIGCOMM
    topic: distributed-system
  - name: MLSys
    topic: gpu-training
  - name: ASPLOS
    topic: gpu-training

# Backstop on how far back to look.  Recommend bumping lower (e.g. 2010) for
# an initial backfill of canonical classics, then ratcheting up later.
since_year: 2018

# Optional hard pre-filter applied before any LLM call.  Venue is already a
# strong relevance signal so this list stays short.
keyword_blocklist:
  - "medical imaging"
  - "image classification"

# Cap analyses per run.  Cost guardrail, and the main review-load knob:
# one small batch a week is easier to actually review than eight papers.
max_candidates_per_run: 3

# Backlog guard.  While this many OTHER paper-bot PRs are still open, the
# weekly run does nothing (no DeepSeek calls, no new PR).  Merging or closing
# the open PR resumes the bot.  0 disables the guard.
max_open_bot_prs: 1

# Analyses are generated from the abstract only.  Skip papers whose abstract
# (as returned by Semantic Scholar) is shorter than this — those produced the
# vaguest notes (e.g. Tiresias / SOCK in 2026-w45).  0 disables the check.
min_abstract_chars: 400

# Papers whose title/abstract contains any of these (case-insensitive) are
# ranked ahead of the rest; citation count still orders within each group.
# Mirrors the owner's focus: cluster scheduling, GPU training/inference
# systems, agent sandboxes / isolation.
focus_keywords:
  - "gpu"
  - "cluster"
  - "schedul"
  - "large language model"
  - "llm"
  - "inference"
  - "serving"
  - "deep learning"
  - "distributed training"
  - "kubernetes"
  - "container"
  - "serverless"
  - "sandbox"
  - "isolation"
  - "kv cache"
  - "checkpoint"
  - "fault toleran"
  - "straggler"
  - "reinforcement learning"
  - "parallelism"

# Allowed topic slugs the classifier may return.  Each must exist as a
# top-level directory in the repo.
topics:
  - distributed-system
  - orchestration-scheduling
  - gpu-training
  - ai
  - agent-sandbox
